<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Solar EV Charging</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EVCharge" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="/style.css?v=20261104b" />
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <div class="bg-glow bg-glow-cyan"></div>
    <div class="bg-glow bg-glow-amber"></div>
    <div class="bg-grid"></div>
  </div>

  <main>
    <header class="topbar">
      <div class="brand">
        <img src="/icons/icon-96.png" width="32" height="32" alt="" class="brand-icon" />
        <div class="brand-text">
          <h1>Solar EV Charging</h1>
          <p class="subtitle">Live control</p>
        </div>
      </div>
      <div class="conn">
        <span id="conn-indicator" class="dot dot-off"></span>
        <span id="conn-label" class="conn-label">Connecting…</span>
      </div>
    </header>

    <section class="flow" aria-label="Power flow">
      <div class="flow-node">
        <div class="flow-icon flow-icon-sun">☀</div>
        <div class="flow-value" id="pv">–</div>
        <div class="flow-label">Solar</div>
      </div>
      <div class="flow-line" id="line-solar"><i></i></div>
      <div class="flow-node">
        <div class="flow-icon flow-icon-house">⌂</div>
        <div class="flow-value" id="load">–</div>
        <div class="flow-label">Home</div>
      </div>
      <div class="flow-line" id="line-surplus"><i></i></div>
      <div class="flow-node flow-node-ev">
        <div class="flow-icon flow-icon-bolt">⚡</div>
        <div class="flow-value" id="surplus">–</div>
        <div class="flow-label">Grid</div>
      </div>
    </section>

    <div class="status-bar" aria-live="polite">
      <p class="decision-pill" id="decision">–</p>
      <p class="status-bar-note" id="decision-note"></p>
    </div>

    <section class="panel">
      <select id="vehicle-select" aria-label="Vehicle">
        <option value="">Select vehicle…</option>
      </select>
      <div class="battery-gauge">
        <div class="battery-gauge-fill" id="battery-fill"></div>
        <span class="battery-gauge-label" id="battery-label">–</span>
      </div>
      <p class="vehicle-meta">
        <span id="charging-state">–</span>
        <span id="amps">–</span>
        <span id="plugged">–</span>
        <span id="charge-limit">–</span>
      </p>
      <!-- Not a login. autocomplete/one-time-code stops iOS Keychain offering a saved password. -->
      <form id="charge-limit-form" class="limit-row" autocomplete="off">
        <span class="limit-label">Limit</span>
        <input id="charge-limit-range" name="ev-charge-limit-slider" type="range" min="50" max="100" step="5" value="80" autocomplete="off" aria-label="Charge limit" />
        <input id="charge-limit-input" name="ev-charge-limit-percent" type="text" inputmode="numeric" pattern="[0-9]*" minlength="2" maxlength="3" placeholder="80" autocomplete="one-time-code" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Charge limit percent" />
        <span class="buffer-unit">%</span>
        <button type="submit">Set</button>
      </form>
      <p id="charge-limit-message"></p>
      <div class="solar-row">
        <label class="switch">
          <input type="checkbox" id="enabled-toggle" />
          <span class="slider"></span>
        </label>
        <span id="enabled-label">Off</span>
        <span id="solar-hint" class="solar-hint">Off stops the car.</span>
      </div>
      <p id="override-message"></p>
      <p id="last-error" class="error"></p>
    </section>
  </main>

  <script src="/app.js?v=20261104b"></script>
</body>
</html>
