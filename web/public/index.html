<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Solar EV Charging</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <header>
      <h1>☀️ Solar EV Charging</h1>
      <span id="conn-indicator" class="dot dot-off" title="connection status"></span>
    </header>

    <section class="cards">
      <div class="card">
        <h2>Solar</h2>
        <dl>
          <dt>PV production</dt><dd id="pv">–</dd>
          <dt>Household load</dt><dd id="load">–</dd>
          <dt>Grid</dt><dd id="grid">–</dd>
          <dt>Surplus for EV</dt><dd id="surplus">–</dd>
        </dl>
      </div>

      <div class="card">
        <h2>Vehicle</h2>
        <div class="controls" style="margin-bottom: 12px;">
          <select id="vehicle-select">
            <option value="">Select vehicle…</option>
          </select>
        </div>
        <dl>
          <dt>Plugged in</dt><dd id="plugged">–</dd>
          <dt>Charging state</dt><dd id="charging-state">–</dd>
          <dt>Battery</dt><dd id="battery">–</dd>
          <dt>Charge amps</dt><dd id="amps">–</dd>
        </dl>
      </div>

      <div class="card">
        <h2>Controller</h2>
        <dl>
          <dt>Decision</dt><dd id="decision">–</dd>
          <dt>Target amps</dt><dd id="target-amps">–</dd>
          <dt>Last poll</dt><dd id="last-poll">–</dd>
        </dl>
        <p id="last-error" class="error"></p>
      </div>
    </section>

    <section class="override">
      <h2>Solar charging</h2>
      <div class="controls">
        <label class="switch">
          <input type="checkbox" id="enabled-toggle" />
          <span class="slider"></span>
        </label>
        <span id="enabled-label">On</span>
      </div>
      <form id="buffer-form" class="controls">
        <label>
          Grid import buffer (W)
          <input id="buffer-input" type="number" min="0" step="50" placeholder="0" />
        </label>
        <button type="submit">Set</button>
      </form>
      <p id="override-message"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
