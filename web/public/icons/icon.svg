  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow2)"/>

  <circle cx="256" cy="256" r="192" fill="none" stroke="#22d3ee" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="3"
          stroke-dasharray="14 500" stroke-linecap="round" transform="rotate(-90 256 256)"/>

  <g transform="translate(76,76) scale(15)" filter="url(#blur)" opacity="0.6">
    <path d="M7 2 V13 H10 V22 L17 10 H13 L17 2 Z" fill="#22d3ee"/>
  </g>

  <g transform="translate(76,76) scale(15)">
