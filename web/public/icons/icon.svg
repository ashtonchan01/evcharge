<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#161b3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="65%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="78%" cy="86%" r="55%">
      <stop offset="0" stop-color="#ffb703" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
